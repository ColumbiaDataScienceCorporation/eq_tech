name: Apps CI/CD

on:
  push:
    branches: [develop, uat, main]
    paths:
      - "apps/**"
      - "k8s/**"
      - "lib/**"
      - ".github/workflows/apps-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: eqtechacr
  ACR_LOGIN_SERVER: eqtechacr.azurecr.io

jobs:
  build:
    name: Build & Push - ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { name: api,     path: apps/api,    image: api,     deployment: api,      container: api      }
          - { name: ui-dash, path: apps/ui-dash, image: ui-dash, deployment: dash-app, container: dash-app }
          - { name: ui-web,  path: apps/ui-web,  image: ui-web,  deployment: web-ui,   container: web-ui   }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build & Push Docker Image to ACR
        # AKS node is ARM64 (Standard_D4pls_v5 Ampere Altra); build both arches for portability
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:${{ github.ref_name }} \
            -f ${{ matrix.app.path }}/Dockerfile \
            --push \
            .
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:latest \
              ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:${{ github.sha }}
          fi

  deploy-dev:
    name: Deploy - dev
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    needs: [build]
    strategy:
      matrix:
        app:
          - { name: api,     image: api,     deployment: api,      container: api,      manifest: api-deployment.yaml  }
          - { name: ui-dash, image: ui-dash, deployment: dash-app, container: dash-app, manifest: dash-deployment.yaml }
          - { name: ui-web,  image: ui-web,  deployment: web-ui,   container: web-ui,   manifest: web-deployment.yaml  }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az aks get-credentials --resource-group eq-tech-rg --name eq-tech-aks --overwrite-existing
      - name: Deploy to dev-apps
        run: |
          kubectl apply -f k8s/namespaces.yaml
          kubectl apply -f k8s/apps/${{ matrix.app.manifest }} -n dev-apps
          kubectl apply -f k8s/ingress/dev.yaml -n dev-apps
          kubectl set image deployment/${{ matrix.app.deployment }} \
            ${{ matrix.app.container }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:${{ github.sha }} \
            -n dev-apps

  deploy-uat:
    name: Deploy - uat
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    needs: [build]
    strategy:
      matrix:
        app:
          - { name: api,     image: api,     deployment: api,      container: api,      manifest: api-deployment.yaml  }
          - { name: ui-dash, image: ui-dash, deployment: dash-app, container: dash-app, manifest: dash-deployment.yaml }
          - { name: ui-web,  image: ui-web,  deployment: web-ui,   container: web-ui,   manifest: web-deployment.yaml  }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az aks get-credentials --resource-group eq-tech-rg --name eq-tech-aks --overwrite-existing
      - name: Deploy to uat-apps
        run: |
          kubectl apply -f k8s/apps/${{ matrix.app.manifest }} -n uat-apps
          kubectl apply -f k8s/ingress/uat.yaml -n uat-apps
          kubectl set image deployment/${{ matrix.app.deployment }} \
            ${{ matrix.app.container }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:${{ github.sha }} \
            -n uat-apps

  deploy-prod:
    name: Deploy - prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    needs: [build]
    strategy:
      matrix:
        app:
          - { name: api,     image: api,     deployment: api,      container: api,      manifest: api-deployment.yaml  }
          - { name: ui-dash, image: ui-dash, deployment: dash-app, container: dash-app, manifest: dash-deployment.yaml }
          - { name: ui-web,  image: ui-web,  deployment: web-ui,   container: web-ui,   manifest: web-deployment.yaml  }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az aks get-credentials --resource-group eq-tech-rg --name eq-tech-aks --overwrite-existing
      - name: Deploy to prod-apps
        run: |
          kubectl apply -f k8s/apps/${{ matrix.app.manifest }} -n prod-apps
          kubectl apply -f k8s/ingress/prod.yaml -n prod-apps
          kubectl set image deployment/${{ matrix.app.deployment }} \
            ${{ matrix.app.container }}=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app.image }}:${{ github.sha }} \
            -n prod-apps