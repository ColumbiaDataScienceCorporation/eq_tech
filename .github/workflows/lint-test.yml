name: Lint and Test

on:
  pull_request:
    branches: [develop, uat, main]
  push:
    branches: [develop, uat, main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt httpx
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        env:
          EQTECH_ENVIRONMENT: dev
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api:${{ github.workspace }}/apps/ui-dash
        run: pytest tests/ -q --tb=short