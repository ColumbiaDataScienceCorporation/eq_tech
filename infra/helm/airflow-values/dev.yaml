# Dev overrides: reduced resources for the trial cluster
scheduler:
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
webserver:
  # Webserver needs more RAM than scheduler; gunicorn + Airflow import is heavy
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi"   }
  # Give gunicorn up to 15 min to start (600s) on a cold node with limited CPU
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 90
config:
  webserver:
    base_url: "https://dev.eq-tech.52.185.94.105.nip.io/airflow"
ingress:
  web:
    hosts:
      - name: "dev.eq-tech.52.185.94.105.nip.io"
    path: "/airflow"
