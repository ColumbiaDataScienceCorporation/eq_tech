# Dev overrides: reduced resources for the demo cluster
scheduler:
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "500m", memory: "1Gi"   }
webserver:
  # Webserver needs more RAM than scheduler; gunicorn + Airflow import is heavy
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi"   }
  # Give gunicorn up to 15 min to start (600s) on a cold node with limited CPU
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 90
config:
  webserver:
    base_url: "https://dev.eq-tech.52.185.94.105.nip.io/airflow"
ingress:
  web:
    annotations:
      nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.dev-auth.svc.cluster.local:4180/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-signin: "https://dev.eq-tech.52.185.94.105.nip.io/oauth2/start?rd=$escaped_request_uri"
      nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - name: "dev.eq-tech.52.185.94.105.nip.io"
    path: "/airflow"
    tls:
      enabled: true
      secretName: dev-airflow-tls

dags:
  gitSync:
    branch: "develop"
