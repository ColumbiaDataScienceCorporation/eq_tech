# Demo-grade sizing (same as dev/uat) — single-node cluster cannot fit production-sized requests
scheduler:
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "500m", memory: "1Gi"   }
webserver:
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi"   }
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 90
config:
  webserver:
    base_url: "https://eq-tech.52.185.94.105.nip.io/airflow"
ingress:
  web:
    hosts:
      - name: "eq-tech.52.185.94.105.nip.io"
    path: "/airflow"

dags:
  gitSync:
    branch: "main"
