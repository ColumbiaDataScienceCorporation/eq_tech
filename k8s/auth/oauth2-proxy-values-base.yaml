# Base oauth2-proxy Helm values shared across all environments.
# Deploy using per-env override files (oauth2-proxy-values-dev.yaml etc.)
# helm upgrade --install oauth2-proxy oauth2-proxy/oauth2-proxy \
#   --namespace <env>-auth --create-namespace \
#   --values k8s/auth/oauth2-proxy-values-base.yaml \
#   --values k8s/auth/oauth2-proxy-values-<env>.yaml

config:
  existingSecret: oauth2-proxy

extraArgs:
  provider: oidc
  # common endpoint supports both organizational and personal Microsoft accounts
  oidc-issuer-url: "https://login.microsoftonline.com/common/v2.0"
  # MSA tokens have a different issuer; skip strict check
  insecure-oidc-skip-issuer-verification: "true"
  scope: "openid profile email"
  email-domain: "*"
  pass-user-headers: "true"
  pass-access-token: "true"
  set-xauthrequest: "true"
  # Forward Entra groups claim as X-Auth-Request-Groups header
  oidc-groups-claim: "groups"
  upstream: "file:///dev/null"

service:
  type: ClusterIP
  portNumber: 4180

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"
