# Replace 52.185.94.105 with the NGINX Ingress LoadBalancer external IP.
# Apply with: kubectl apply -f k8s/ingress/prod.yaml -n prod-apps
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eq-tech-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://eq-tech.52.185.94.105.nip.io/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups"
spec:
  ingressClassName: nginx
  rules:
    - host: "eq-tech.52.185.94.105.nip.io"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
          - path: /dash
            pathType: Prefix
            backend:
              service:
                name: dash-service
                port:
                  number: 8050
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
